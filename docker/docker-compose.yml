version: '2.0'
services:
  maia:
    build:
      context: ..
      dockerfile: docker/Dockerfile.latest
    image: maia:local
    container_name: maia
    security_opt:
      - seccomp:unconfined
    ports:
      - "9899:9899"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MAIA_LANG: 'auto'
      CHANNEL_TYPE: 'web'
      # The proxy runs on the host. host-gateway below makes this name resolve.
      LITELLM_API_BASE: 'http://host.docker.internal:4000/v1'
      LITELLM_API_KEY: ''
      LITELLM_MODEL: ''
      VOICE_TO_TEXT: 'litellm'
      TEXT_TO_VOICE: 'litellm'
      VOICE_REPLY_VOICE: 'False'
      # The published port is reachable from the host. Set WEB_PASSWORD before sharing it.
      WEB_HOST: '0.0.0.0'
      WEB_PASSWORD: ''
      AGENT: 'True'
      # Container is already an isolation boundary, so the agent runs unconfined inside it
      AGENT_PERMISSION_MODE: 'full-access'
      AGENT_MAX_CONTEXT_TOKENS: 200000
      AGENT_MAX_CONTEXT_TURNS: 30
      AGENT_MAX_STEPS: 100
      SELF_EVOLUTION_ENABLED: 'True'
      # Writable data root (config.json, run.log, credentials) — kept separate
      # from the workspace so it survives image upgrades / container recreation.
      MAIA_DATA_DIR: '/home/agent/.maia'
    volumes:
      # Workspace: skills, memory, knowledge, mcp.json, conversation artifacts
      - ./maia:/home/agent/maia
      # Data root: config.json, run.log, credentials
      - ./maia-data:/home/agent/.maia
