<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" rx="28" fill="#F4F7FE"/>
  <text x="48" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#16285F">Memory</text>
  <text x="168" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="500" fill="#243F9A">in the workspace</text>

  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="48" y="120" width="320" height="150" rx="16" fill="#4169E1"/>
    <text x="208" y="175" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Conversation</text>
    <text x="208" y="205" text-anchor="middle" fill="#E0E8FC" font-size="15">short-term context</text>
    <text x="208" y="230" text-anchor="middle" fill="#E0E8FC" font-size="14">trimmed when it grows</text>

    <rect x="440" y="120" width="320" height="150" rx="16" fill="#2F52C4"/>
    <text x="600" y="175" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Daily memory</text>
    <text x="600" y="205" text-anchor="middle" fill="#E0E8FC" font-size="15">memory/YYYY-MM-DD.md</text>
    <text x="600" y="230" text-anchor="middle" fill="#E0E8FC" font-size="14">written on trim and at night</text>

    <rect x="832" y="120" width="320" height="150" rx="16" fill="#1A3C9C"/>
    <text x="992" y="175" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">MEMORY.md</text>
    <text x="992" y="205" text-anchor="middle" fill="#E0E8FC" font-size="15">long-term core memory</text>
    <text x="992" y="230" text-anchor="middle" fill="#E0E8FC" font-size="14">does not decay</text>
  </g>

  <g stroke="#4169E1" stroke-width="3" fill="none">
    <path d="M368 195 H440"/>
    <path d="M760 195 H832"/>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="440" y="300" width="320" height="72" rx="16" fill="#FFFFFF" stroke="#C5D4FA" stroke-width="2"/>
    <text x="600" y="332" text-anchor="middle" fill="#1A3C9C" font-size="16" font-weight="700">Dream diary</text>
    <text x="600" y="354" text-anchor="middle" fill="#5C6B8A" font-size="13">memory/dreams/YYYY-MM-DD.md</text>
  </g>
  <path d="M600 270 V300" stroke="#4169E1" stroke-width="3" fill="none"/>
</svg>
