<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" rx="28" fill="#F4F7FE"/>
  <text x="48" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#16285F">Maia</text>
  <text x="128" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="500" fill="#243F9A">request path</text>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#16285F">
    <rect x="48" y="120" width="250" height="88" rx="16" fill="#4169E1"/>
    <text x="173" y="160" text-anchor="middle" fill="#FFFFFF" font-weight="650">Web console</text>
    <text x="173" y="184" text-anchor="middle" fill="#E0E8FC" font-size="14">browser</text>

    <rect x="48" y="228" width="250" height="88" rx="16" fill="#2F52C4"/>
    <text x="173" y="268" text-anchor="middle" fill="#FFFFFF" font-weight="650">Terminal</text>
    <text x="173" y="292" text-anchor="middle" fill="#E0E8FC" font-size="14">local stdin</text>

    <rect x="430" y="174" width="250" height="88" rx="16" fill="#1A3C9C"/>
    <text x="555" y="214" text-anchor="middle" fill="#FFFFFF" font-weight="650">Bridge</text>
    <text x="555" y="238" text-anchor="middle" fill="#E0E8FC" font-size="14">one bot type: litellm</text>

    <rect x="812" y="120" width="340" height="196" rx="16" fill="#FFFFFF" stroke="#4169E1" stroke-width="3"/>
    <text x="982" y="164" text-anchor="middle" font-weight="700" fill="#1A3C9C">LiteLLM endpoint</text>
    <text x="982" y="196" text-anchor="middle" font-size="15" fill="#243F9A">POST /v1/chat/completions</text>
    <text x="982" y="222" text-anchor="middle" font-size="15" fill="#243F9A">embeddings, images, speech</text>
    <text x="982" y="248" text-anchor="middle" font-size="15" fill="#243F9A">model id is not rewritten</text>
    <text x="982" y="280" text-anchor="middle" font-size="14" fill="#5C6B8A">empty model id turns that</text>
    <text x="982" y="300" text-anchor="middle" font-size="14" fill="#5C6B8A">capability off</text>
  </g>

  <g stroke="#4169E1" stroke-width="3" fill="none">
    <path d="M298 164 H390 V218 H430"/>
    <path d="M298 272 H390 V218 H430"/>
    <path d="M680 218 H812"/>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#16285F">
    <rect x="48" y="390" width="1104" height="196" rx="16" fill="#FFFFFF" stroke="#C5D4FA"/>
    <text x="72" y="430" font-size="16" font-weight="700" fill="#1A3C9C">Local tools, only when you turn them on</text>
    <text x="72" y="470">Files, terminal, browser, scheduler, memory, knowledge, skills</text>
    <text x="72" y="502">MCP servers from your own mcp.json</text>
    <text x="72" y="534">Web search only through the SearXNG URL you set</text>
    <text x="72" y="566" fill="#5C6B8A">No other chat channel. No vendor SDK. No hosted skill catalog.</text>
  </g>
</svg>
